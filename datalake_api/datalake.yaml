openapi: 3.0.0
info:
  title: DATA LAKE
  version: 1.0.0
  description: Data Lake customer master, benefit balance, member, and CRM DIM/fact
    policy endpoints across ISF, Actisure, DA, and related core systems.
servers:
- url: 'https://esb-gateway.com/api/v1/data-lake'
  description: ESB Gateway Base URL
tags:
- name: Data Lake
  description: Customer master data and benefit balance endpoints
- name: Data Lake — CRM
  description: CRM staging DIM and fact policy sync endpoints
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Obtain token via POST /api/auth/signin. Expires in 300 seconds.
paths:
  /getCustomerMasterData:
    get:
      summary: Get customer master data (v1)
      description: Retrieve customer master data using a JSON request body.
      tags:
      - Data Lake
      security:
      - BearerAuth: []
      parameters: []
      responses:
        '200':
          description: Request processed successfully.
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized — missing or expired authentication token.
        '500':
          description: Internal Server Error — contact the Jubilee integration team.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nationalIdNumber:
                  type: string
                taxIdNumber:
                  type: string
                entityId:
                  type: string
                  description: Beneficiary / entity ID (@JsonProperty entityId)
                country:
                  type: string
            example:
              nationalIdNumber: CM90003100WD5J1212
              taxIdNumber: UK001PMR
              entityId: '12438739'
  /v2/getCustomerMasterData:
    get:
      summary: Get customer master data (v2)
      description: Retrieve customer master data by National ID, Taxpayer ID, or Entity
        ID.
      tags:
      - Data Lake
      security:
      - BearerAuth: []
      parameters:
      - name: NationalID
        in: query
        required: false
        schema:
          type: string
          example: '28363203'
        description: National ID number
      - name: TaxpayerID
        in: query
        required: false
        schema:
          type: string
        description: KRA taxpayer ID
      - name: EntityID
        in: query
        required: false
        schema:
          type: string
          example: '12470478'
        description: Entity / beneficiary ID
      responses:
        '200':
          description: Request processed successfully.
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized — missing or expired authentication token.
        '500':
          description: Internal Server Error — contact the Jubilee integration team.
  /v3/getCustomerMasterData:
    get:
      summary: Get customer master data (v3)
      description: Retrieve customer master data by Entity ID and country (ApiResponseV3
        wrapper).
      tags:
      - Data Lake
      security:
      - BearerAuth: []
      parameters:
      - name: EntityID
        in: query
        required: true
        schema:
          type: string
          example: '12470478'
        description: Entity / beneficiary ID
      - name: country
