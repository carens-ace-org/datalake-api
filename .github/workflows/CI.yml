name: ACE CI
run-name: "${{ github.run_number }}: ${{ github.event.head_commit.message || github.event.pull_request.title || github.event.inputs.deployment_type || 'Pipeline Run' }}"

on:
  push:
    branches: [ "dev", "main", "master" ]
  pull_request:
    branches: [ "dev", "main", "master" ]
  workflow_dispatch:
    inputs:
      deployment_type:
        description: 'Select deployment type'
        required: true
        type: choice
        options:
          - Deploy
          - Rollback
        default: Deploy
      rollback_run_id:
        description: 'GitHub Actions Run ID of the successful deployment to restore'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ace-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  initialize-action:
    name: Initialize and Validate
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Workflow Dispatch Mode
        run: |
          echo "Deployment Type: ${{ github.event.inputs.deployment_type || 'Deploy' }}"
          if [ "${{ github.event.inputs.deployment_type }}" == "Rollback" ]; then
            if [ -z "${{ github.event.inputs.rollback_run_id }}" ]; then
              echo "Error: rollback_run_id must be provided when performing a rollback."
              exit 1
            fi
            echo "Restoring artifacts from Target Run ID: ${{ github.event.inputs.rollback_run_id }}"
          else
            echo "Executing standard deployment flow."
          fi

  openapi-lint:
    name: 2. Redocly OpenAPI lint
    needs: initialize-action
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint OpenAPI specs referenced by ACE descriptors
        run: node scripts/lint-openapi.cjs

  trufflehog-scan:
    name: 3. TruffleHog Secret Leak Check
    needs: openapi-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Install TruffleHog CLI
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run TruffleHog & Generate Report
        id: trufflehog
        continue-on-error: true
        run: |
          # Removed --only-verified so test mock strings and high-entropy patterns trigger failures
          trufflehog git file://. --json > trufflehog-results.json

      - name: Print TruffleHog Summary
        run: |
          echo "=== TruffleHog Secret Scan Summary ==="
          if [ -s trufflehog-results.json ]; then
            jq -r '"Detector: \(.DetectorName) | Path: \(.SourceMetadata.Data.Git.file) | Commit: \(.SourceMetadata.Data.Git.commit)"' trufflehog-results.json || echo "No secrets formatted."
          else
            echo "No secrets detected or report is empty."
          fi

      - name: Upload TruffleHog JSON Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-json-report-${{ github.run_id }}
          path: trufflehog-results.json
          if-no-files-found: warn

      - name: Evaluate Scan Status
        run: |
          if [ -s trufflehog-results.json ] && grep -q '"SourceMetadata"' trufflehog-results.json 2>/dev/null; then
            echo "=================================================="
            echo "❌ ERROR: Verified/Detected secrets found by TruffleHog!"
            echo "=================================================="
            echo "Please review the affected files below:"
            echo ""
            
            # Use jq to extract clean, readable lines showing detector, file path, and commit
            jq -r 'select(.SourceMetadata != null) | "  - Detector: \(.DetectorName)\n    File:     \(.SourceMetadata.Data.Git.file)\n    Commit:   \(.SourceMetadata.Data.Git.commit)\n    Line:     \(.SourceMetadata.Data.Git.line)\n"' trufflehog-results.json
            
            echo "=================================================="
            echo "Action required: Remove the hardcoded secret(s) or add them"
            echo "to your ignore list before pushing again."
            echo "=================================================="
            exit 1
          else
            echo "✅ TruffleHog check passed successfully. No secrets detected."
          fi

  trivy-scan:
    name: 4. Trivy Vulnerability and Config Scan
    needs: trufflehog-scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          set -euo pipefail
          TRIVY_VERSION="0.76.1"
          mkdir -p "$HOME/.local/bin"
          curl -sfL \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" trivy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/trivy" --version

      - name: Download Trivy HTML Template
        run: |
          curl -fL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl -o html.tpl
          test -s html.tpl || { echo "html.tpl is missing or empty"; exit 1; }

      - name: Run Trivy rootfs scan
        env:
          TRIVY_JAVA_DB_REPOSITORY: "ghcr.io/aquasecurity/trivy-java-db"
          TRIVY_DEBUG: "true"
        run: |
          trivy rootfs . \
            --scanners vuln,misconfig,secret \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            --ignore-unfixed=false \
            --skip-dirs .git,.metadata \
            --format template \
            --template '@html.tpl' \
            --output trivy-results.html \
            --debug

      - name: Verify Trivy report was generated and is not empty
        run: |
          if [ ! -f trivy-results.html ]; then
            echo "ERROR: trivy-results.html was not created."
            exit 1
          fi
          SIZE=$(wc -c < trivy-results.html)
          echo "trivy-results.html size: ${SIZE} bytes"

      - name: Upload Trivy HTML Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-html-report-${{ github.run_id }}
          path: trivy-results.html
          if-no-files-found: warn

  ibm-secret-scan:
    name: 5. IBM detect-secrets scan
    needs: trivy-scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python for IBM detect-secrets
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run IBM detect-secrets Strict Audit
        run: |
          pip install --upgrade "git+https://github.com/ibm/detect-secrets.git@master#egg=detect-secrets"
          
          if [ -f .secrets.baseline ]; then
            echo "Auditing repository against existing .secrets.baseline..."
            # Strict audit mode: fails the build if new unbaselined secrets are introduced
            detect-secrets audit --baseline .secrets.baseline || {
              echo "ERROR: Unbaselined secrets detected by IBM detect-secrets!"
              exit 1
            }
          else
            echo "No .secrets.baseline found. Generating initial baseline..."
            detect-secrets scan > .secrets.baseline
            echo "Please commit the initial .secrets.baseline file to your repository."
            exit 1
          fi

  sonarqube:
    name: 6. SonarQube Code Quality & Gates
    needs: ibm-secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ hashFiles('**/sonar-project.properties') }}
          restore-keys: ${{ runner.os }}-sonar-

      - name: Run SonarQube analysis and quality gate
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=ace-enterprise-integration
            -Dsonar.scanner.javaExePath=${{ env.JAVA_HOME }}/bin/java
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600