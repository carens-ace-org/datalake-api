name: ACE CI
run-name: "${{ github.run_number }}: ${{ github.event.head_commit.message || github.event.pull_request.title || github.event.inputs.deployment_type || 'Pipeline Run' }}"

on:
  push:
    branches: [ "dev", "main", "master" ]
  pull_request:
    branches: [ "dev", "main", "master" ]
  workflow_dispatch:
    inputs:
      deployment_type:
        description: 'Select deployment type'
        required: true
        type: choice
        options:
          - Deploy
          - Rollback
        default: Deploy
      rollback_run_id:
        description: 'GitHub Actions Run ID of the successful deployment to restore'
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ace-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  initialize-action:
    name: Initialize and Validate
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Workflow Dispatch Mode
        run: |
          echo "Deployment Type: ${{ github.event.inputs.deployment_type || 'Deploy' }}"
          if [ "${{ github.event.inputs.deployment_type }}" == "Rollback" ]; then
            if [ -z "${{ github.event.inputs.rollback_run_id }}" ]; then
              echo "Error: rollback_run_id must be provided when performing a rollback."
              exit 1
            fi
            echo "Restoring artifacts from Target Run ID: ${{ github.event.inputs.rollback_run_id }}"
          else
            echo "Executing standard deployment flow."
          fi

  openapi-lint:
    name: 2. Redocly OpenAPI lint
    needs: initialize-action
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Lint OpenAPI specs referenced by ACE descriptors
        run: node scripts/lint-openapi.cjs

  trufflehog-scan:
    name: 3. TruffleHog Secret Leak Check
    needs: openapi-lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Install TruffleHog CLI
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run TruffleHog & Generate Report
        id: trufflehog
        continue-on-error: true
        run: |
          # Exclude .git folder, the results file itself, ACE policies, and BAR archives
          trufflehog filesystem . --json --no-verification \
            --exclude-paths <(echo -e ".git/.*\ntrufflehog-results\.json\n.*\.bar\n.*\.policyxml") \
            > trufflehog-results.json 2>&1 || true

      - name: Upload TruffleHog JSON Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trufflehog-json-report-${{ github.run_id }}
          path: trufflehog-results.json
          if-no-files-found: error

      - name: Evaluate Scan Status and Print Exact Secrets
        run: |
          if grep -q '"DetectorName"' trufflehog-results.json 2>/dev/null; then
            echo "=================================================="
            echo "❌ ERROR: Secrets found by TruffleHog!"
            echo "=================================================="
            echo "📥 Download the full JSON report artifact above for complete details."
            echo ""
            
            jq -r 'select(.DetectorName != null) | "  - Detector: \(.DetectorName)\n    File:     \(.SourceMetadata.Data.Filesystem.file // "unknown")\n    Line:     \(.SourceMetadata.Data.Filesystem.line // "unknown")\n    Secret:   \(.Raw // "N/A")\n"' trufflehog-results.json 2>/dev/null || echo "Check uploaded artifact for full results."
            
            echo "=================================================="
            exit 1
          else
            echo "✅ TruffleHog check passed successfully. No secrets detected."
          fi

  trivy-scan:
    name: 4. Trivy Vulnerability and Config Scan
    needs: trufflehog-scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          set -euo pipefail
          TRIVY_VERSION="0.76.1"
          mkdir -p "$HOME/.local/bin"
          curl -sfL \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            | tar -xz -C "$HOME/.local/bin" trivy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/trivy" --version

      - name: Run Trivy rootfs scan (including JAR and secret inspection)
        env:
          TRIVY_JAVA_DB_REPOSITORY: "ghcr.io/aquasecurity/trivy-java-db"
          TRIVY_DEBUG: "true"
        run: |
          # Scan rootfs, forcing archive/JAR inspection and secret detection
          trivy rootfs . \
            --scanners vuln,misconfig,secret \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            --ignore-unfixed=false \
            --skip-dirs .git,.metadata \
            --format json \
            --output trivy-results.json \
            --debug

      - name: Verify Trivy report was generated and is not empty
        run: |
          if [ ! -f trivy-results.json ]; then
            echo "ERROR: trivy-results.json was not created."
            exit 1
          fi
          SIZE=$(wc -c < trivy-results.json)
          echo "trivy-results.json size: ${SIZE} bytes"

      - name: Upload Trivy JSON Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-json-report-${{ github.run_id }}
          path: trivy-results.json
          if-no-files-found: error

  ibm-secret-scan:
            name: 5. IBM detect-secrets scan
            needs: trivy-scan
            runs-on: ubuntu-latest
            steps:
              - name: Check out source
                uses: actions/checkout@v4
                with:
                  fetch-depth: 0
        
              - name: Set up Python for IBM detect-secrets
                uses: actions/setup-python@v5
                with:
                  python-version: '3.11'
        
              - name: Run IBM detect-secrets Non-Interactive Audit and Save Report
                id: ibm-audit
                continue-on-error: true
                run: |
                  pip install --upgrade "git+https://github.com/ibm/detect-secrets.git@master#egg=detect-secrets"
                  
                  if [ -f .secrets.baseline ]; then
                    echo "Scanning current workspace for unbaselined secrets..."
                    # Use scan to output current findings and compare against baseline non-interactively
                    detect-secrets scan > current-scan.json
                    
                    # Log output details to report file for artifact download
                    echo "=== IBM detect-secrets Scan Report ===" > ibm-detect-secrets-report.txt
                    detect-secrets audit .secrets.baseline --report 2>&1 | tee -a ibm-detect-secrets-report.txt || true
                  else
                    echo "No .secrets.baseline found. Generating initial baseline..."
                    detect-secrets scan > .secrets.baseline
                    echo "Generated initial .secrets.baseline" > ibm-detect-secrets-report.txt
                    exit 1
                  fi
        
              - name: Upload IBM detect-secrets Report Artifact
                if: always()
                uses: actions/upload-artifact@v4
                with:
                  name: ibm-detect-secrets-report-${{ github.run_id }}
                  path: ibm-detect-secrets-report.txt
                  if-no-files-found: error
        
              - name: Evaluate IBM Audit Status
                run: |
                  if grep -i "error" ibm-detect-secrets-report.txt || [ -s .secrets.baseline ]; then
                    echo "=================================================="
                    echo "❌ ERROR: Unbaselined secrets detected by IBM detect-secrets!"
                    echo "=================================================="
                    echo "📥 Download the full IBM audit report artifact above for exact details."
                    exit 1
                  else
                    echo "✅ IBM detect-secrets check passed."
                  fi

  sonarqube:
    name: 6. SonarQube Code Quality & Gates
    needs: ibm-secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ hashFiles('**/sonar-project.properties') }}
          restore-keys: ${{ runner.os }}-sonar-

      - name: Run SonarQube analysis and quality gate
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=ace-enterprise-integration
            -Dsonar.scanner.javaExePath=${{ env.JAVA_HOME }}/bin/java
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600