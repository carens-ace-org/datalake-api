name: ACE Enterprise CI/CD Pipeline

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'Target environment to deploy'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - test
          - prod

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: ace-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  initialize-action:
    name: Initialize and Validate
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate Workflow Execution Mode
        run: echo "Executing CI Pipeline for ref ${{ github.ref }}"

  openapi-lint:
    name: 2. Redocly OpenAPI lint
    needs: initialize-action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/lint-openapi.cjs

  trufflehog-scan:
    name: 3. TruffleHog Secret Leak Check
    needs: openapi-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install TruffleHog CLI
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Run TruffleHog Scan
        continue-on-error: true
        run: |
          trufflehog filesystem . --json --no-verification \
            --exclude-paths <(echo -e ".git/.*\ntrufflehog-results\.json\n.*\.bar\n.*\.policyxml") \
            > trufflehog-results.json 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: trufflehog-json-report-${{ github.run_id }}
          path: trufflehog-results.json
          if-no-files-found: error
      - name: Evaluate Scan Status
        run: |
          if grep -q '"DetectorName"' trufflehog-results.json 2>/dev/null; then
            echo " ERROR: Secrets found by TruffleHog!"
            exit 1
          else
            echo " TruffleHog check passed."
          fi

  trivy-scan:
    name: 4. Trivy Vulnerability & JAR Scan
    needs: trufflehog-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Trivy
        run: |
          set -euo pipefail
          TRIVY_VERSION="0.76.1"
          mkdir -p "$HOME/.local/bin"
          curl -sfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | tar -xz -C "$HOME/.local/bin" trivy
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Download Trivy HTML Template
        run: curl -fL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/html.tpl -o html.tpl
      - name: Run Trivy Scan
        env:
          TRIVY_JAVA_DB_REPOSITORY: "ghcr.io/aquasecurity/trivy-java-db"
        run: |
          trivy rootfs . \
            --scanners vuln,misconfig,secret \
            --severity LOW,MEDIUM,HIGH,CRITICAL \
            --ignore-unfixed=false \
            --skip-dirs .git,.metadata \
            --format template \
            --template '@html.tpl' \
            --output trivy-results.html
      - uses: actions/upload-artifact@v4
        with:
          name: trivy-html-report-${{ github.run_id }}
          path: trivy-results.html
          if-no-files-found: error

  ibm-secret-scan:
    name: 5. IBM detect-secrets scan
    needs: trivy-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run IBM detect-secrets Audit
        continue-on-error: true
        run: |
          pip install --upgrade "git+https://github.com/ibm/detect-secrets.git@master#egg=detect-secrets"
          if [ -f .secrets.baseline ]; then
            echo "=== IBM detect-secrets Audit Report ===" > ibm-detect-secrets-report.txt
            detect-secrets audit .secrets.baseline --report 2>&1 | tee -a ibm-detect-secrets-report.txt || true
          else
            detect-secrets scan > .secrets.baseline
            echo "Generated initial .secrets.baseline" > ibm-detect-secrets-report.txt
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ibm-detect-secrets-report-${{ github.run_id }}
          path: ibm-detect-secrets-report.txt
          if-no-files-found: error
      - name: Evaluate IBM Audit Status
        run: |
          if grep -q "Unaudited secrets were found" ibm-detect-secrets-report.txt; then
            echo " ERROR: Unaudited secrets detected by IBM detect-secrets!"
            exit 1
          else
            echo " IBM detect-secrets check passed."
          fi

  sonarqube:
    name: 6. SonarQube Code Quality & Gates
    needs: ibm-secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.projectKey=ace-enterprise-integration
            -Dsonar.scanner.javaExePath=${{ env.JAVA_HOME }}/bin/java
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600

  # ==========================================
  # LINEAR CD STAGE: Dev -> Test -> Prod (Frankfurt)
  # ==========================================
  deploy-dev:
    name: 7. Deploy to Dev (Frankfurt)
    needs: sonarqube
    runs-on: ubuntu-latest
    environment:
      name: dev
    steps:
      - uses: actions/checkout@v4
      - name: Run Deployment Sequence
        run: |
          BAR_FILE=$(find BARfiles -maxdepth 1 -name "*.bar" | head -n 1)
          BAR_NAME=$(basename "$BAR_FILE")
          ROUTE_NAME=$(basename "$BAR_NAME" .bar)
          RUNTIME_NAME="datalake-api-dev"
          API_HOST="https://api.a-fra-c1.appconnect.ipaas.automation.ibm.com"

          echo "Authenticating with App Connect Frankfurt..."
          TOKEN_RESP=$(curl -s -X POST "$API_HOST/api/v1/tokens" \
            -H "X-IBM-Client-Id: ${{ secrets.CLIENT_ID }}" \
            -H "X-IBM-Client-Secret: ${{ secrets.CLIENT_SECRET }}" \
            -H "x-ibm-instance-id: ${{ secrets.INSTANCE_ID }}" \
            -H "accept: application/json" -H "content-type: application/json" \
            -d "{\"apiKey\": \"${{ secrets.API_KEY }}\"}")
          
          ACCESS_TOKEN=$(echo "$TOKEN_RESP" | jq -r '.access_token')

          echo "Uploading BAR file $BAR_NAME..."
          UPLOAD_RESP=$(curl -s -X PUT "$API_HOST/api/v1/bar-files/$ROUTE_NAME" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "X-IBM-Client-Id: ${{ secrets.CLIENT_ID }}" \
            -H "Content-Type: application/octet-stream" \
            -H "Accept: application/json" \
            --data-binary "@$BAR_FILE")

          BAR_URL=$(echo "$UPLOAD_RESP" | jq -r '.url')
          echo "Received BAR URL: $BAR_URL"

          echo "Creating/Updating Integration Runtime $RUNTIME_NAME..."
          PAYLOAD=$(jq -n --arg name "$RUNTIME_NAME" --arg bar "$BAR_URL" \
            '{metadata: {name: $name}, spec: {version: "13.0", barURL: [$bar], flowType: {toolkitFlow: true}, desiredRunState: "running", replicas: 1}}')

          curl -s -X PUT "$API_HOST/api/v1/integration-runtimes/$RUNTIME_NAME" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "X-IBM-Client-Id: ${{ secrets.CLIENT_ID }}" \
            -H "Content-Type: application/json" -H "Accept: application/json" \
            -d "$PAYLOAD"

  deploy-test:
    name: 8. Promote to Test (Frankfurt)
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment:
      name: test
    steps:
      - uses: actions/checkout@v4
      - name: Run Promotion Sequence
        run: |
          BAR_FILE=$(find BARfiles -maxdepth 1 -name "*.bar" | head -n 1)
          BAR_NAME=$(basename "$BAR_FILE")
          ROUTE_NAME=$(basename "$BAR_NAME" .bar)
          RUNTIME_NAME="datalake-api-test"
          API_HOST="https://api.a-fra-c1.appconnect.ipaas.automation.ibm.com"

          TOKEN_RESP=$(curl -s -X POST "$API_HOST/api/v1/tokens" \
            -H "X-IBM-Client-Id: ${{ secrets.CLIENT_ID }}" \
            -H "X-IBM-Client-Secret: ${{ secrets.CLIENT_SECRET }}" \
            -H "x-ibm-instance-id: ${{ secrets.INSTANCE_ID }}" \
            -H "accept: application/json" -H "content-type: application/json" \
            -d "{\"apiKey\": \"${{ secrets.API_KEY }}\"}")
          
          ACCESS_TOKEN=$(echo "$TOKEN_RESP" | jq -r '.access_token')

          UPLOAD_RESP=$(curl -s -X PUT "$API_HOST/api/v1/bar-files/$ROUTE_NAME" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "X-IBM-Client-Id: ${{ secrets.CLIENT_ID }}" \
            -H "Content-Type: application/octet-stream" \
            -H "Accept: application/json" \
            --data-binary "@$BAR_FILE")

          BAR_URL=$(echo "$UPLOAD_RESP" | jq -r '.url')

          PAYLOAD=$(jq -n --arg name "$RUNTIME_NAME" --arg bar "$BAR_URL" \
            '{metadata: {name: $name}, spec: {version: "13.0", barURL: [$bar], flowType: {toolkitFlow: true}, desiredRunState: "running", replicas: 1}}')

          curl -s -X PUT "$API_HOST/api/v1/integration-runtimes/$RUNTIME_NAME" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "X-IBM-Client-Id: ${{ secrets.CLIENT_ID }}" \
            -H "Content-Type: application/json" -H "Accept: application/json" \
            -d "$PAYLOAD"

  deploy-prod:
    name: 9. Promote to Prod (Frankfurt - Manual Gate)
    needs: deploy-test
    runs-on: ubuntu-latest
    environment:
      name: prod # Pauses here for manual review/approval in GitHub UI!
    steps:
      - uses: actions/checkout@v4
      - name: Run Production Deployment Sequence
        run: |
          BAR_FILE=$(find BARfiles -maxdepth 1 -name "*.bar" | head -n 1)
          BAR_NAME=$(basename "$BAR_FILE")
          ROUTE_NAME=$(basename "$BAR_NAME" .bar)
          RUNTIME_NAME="datalake-api-prod"
          API_HOST="https://api.a-fra-c1.appconnect.ipaas.automation.ibm.com"

          TOKEN_RESP=$(curl -s -X POST "$API_HOST/api/v1/tokens" \
            -H "X-IBM-Client-Id: ${{ secrets.CLIENT_ID }}" \
            -H "X-IBM-Client-Secret: ${{ secrets.CLIENT_SECRET }}" \
            -H "x-ibm-instance-id: ${{ secrets.INSTANCE_ID }}" \
            -H "accept: application/json" -H "content-type: application/json" \
            -d "{\"apiKey\": \"${{ secrets.API_KEY }}\"}")
          
          ACCESS_TOKEN=$(echo "$TOKEN_RESP" | jq -r '.access_token')

          UPLOAD_RESP=$(curl -s -X PUT "$API_HOST/api/v1/bar-files/$ROUTE_NAME" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "X-IBM-Client-Id: ${{ secrets.CLIENT_ID }}" \
            -H "Content-Type: application/octet-stream" \
            -H "Accept: application/json" \
            --data-binary "@$BAR_FILE")

          BAR_URL=$(echo "$UPLOAD_RESP" | jq -r '.url')

          PAYLOAD=$(jq -n --arg name "$RUNTIME_NAME" --arg bar "$BAR_URL" \
            '{metadata: {name: $name}, spec: {version: "13.0", barURL: [$bar], flowType: {toolkitFlow: true}, desiredRunState: "running", replicas: 1}}')

          curl -s -X PUT "$API_HOST/api/v1/integration-runtimes/$RUNTIME_NAME" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "X-IBM-Client-Id: ${{ secrets.CLIENT_ID }}" \
            -H "Content-Type: application/json" -H "Accept: application/json" \
            -d "$PAYLOAD"